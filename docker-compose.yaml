services:
  training-app-pytorch:
    profiles:
      - gpu
    build:
      context: .
      dockerfile: Dockerfile.pytorch
      target: runtime-gpu
    image: training-app-pytorch
    shm_size: "2g"
    container_name: training-app-pytorch
    command: >
      python main.py --mode full --epochs 1 
    volumes:
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
      - paddlemodel:/app/paddlemodel
      - model_cache_hf:/root/.cache/huggingface
      - model_cache_torch:/root/.cache/torch
    env_file:
      - .env
    environment:
      - MODE=full
      - DATASET_DIR=/app/dataset
      - OUTPUT_DIR=/app/outputs
      - HF_HOME=/root/.cache/huggingface
      - TORCH_HOME=/root/.cache/torch
      - PADDLEOCR_HOME=/app/.paddleocr
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

volumes:
  model_cache_hf:
  model_cache_torch:
