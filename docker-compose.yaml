services:
  # Server (GPU) - enable with: docker compose --profile gpu up
  training-app-gpu:
    profiles:
      - gpu
    build:
      context: .
      dockerfile: Dockerfile.training
      target: runtime-gpu
    image: antifraud-training-app
    shm_size: "2g"
    container_name: antifraud_training_gpu
    restart: unless-stopped
    command: python main.py --pipeline classifier --dataset-dir /app/dataset --output_dir /app/outputs
    volumes:
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
      - ./paddle_models:/app/paddle_models
      - model_cache_hf:/root/.cache/huggingface
      - model_cache_torch:/root/.cache/torch
    env_file:
      - .env
    environment:
      - HF_HOME=/root/.cache/huggingface
      - TORCH_HOME=/root/.cache/torch
      - PADDLEOCR_HOME=/app/.paddleocr
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility


