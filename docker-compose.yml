version: '3.8'

services:
  antifraud-training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpjs-antifraud-training
    environment:
      # S3 Configuration (override with your actual values)
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-your-bucket-name}
      - S3_ENDPOINT=${S3_ENDPOINT:-your-s3-endpoint}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-your-access-key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-your-secret-key}
      - S3_CLASSIFIER_PREFIX=${S3_CLASSIFIER_PREFIX:-dataset/classifier/}
      - S3_SIGNATURE_PREFIX=${S3_SIGNATURE_PREFIX:-dataset/signature/}
      
      # Training Configuration
      - CLASSIFIER_CONFIG=${CLASSIFIER_CONFIG:-config/classifier_config.json}
      - SIGNATURE_WORKSPACE=${SIGNATURE_WORKSPACE:-signature-detection}
      - SIGNATURE_PROJECT=${SIGNATURE_PROJECT:-signature-detection-hlx8j-mem1d}
      - SIGNATURE_VERSION=${SIGNATURE_VERSION:-3}
      - SIGNATURE_EPOCHS=${SIGNATURE_EPOCHS:-70}
      
      # Python environment
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    
    volumes:
      # Mount local directories for persistent data
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./logs:/app/logs
      
      # Mount .env file if it exists
      - ./.env:/app/.env:ro
    
    # GPU support (uncomment if using NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'
    
    # Network configuration
    networks:
      - antifraud-network
    
    # Restart policy
    restart: unless-stopped
    
    # Override default command for different use cases
    # Example: python3 main.py --pipeline classifier --epochs 20 --batch_size 16 --num_workers 8 --lr_bert 1e-5 --lr_resnet 5e-5 --lr_heads 5e-4
    command: >
      python3 main.py 
      --pipeline classifier 
      --epochs 10 
      --batch_size 32 
      --num_workers 4 
      --lr_bert 2e-5 
      --lr_resnet 1e-4 
      --lr_heads 1e-3

  # Service untuk training dengan parameter kustom
  classifier-training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpjs-classifier-training
    environment:
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-your-bucket-name}
      - S3_ENDPOINT=${S3_ENDPOINT:-your-s3-endpoint}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-your-access-key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-your-secret-key}
      - S3_CLASSIFIER_PREFIX=${S3_CLASSIFIER_PREFIX:-dataset/classifier/}
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - antifraud-network
    # Custom training parameters - override these values
    command: >
      python3 main.py 
      --pipeline classifier 
      --epochs ${EPOCHS:-20} 
      --batch_size ${BATCH_SIZE:-16} 
      --num_workers ${NUM_WORKERS:-8} 
      --lr_bert ${LR_BERT:-1e-5} 
      --lr_resnet ${LR_RESNET:-5e-5} 
      --lr_heads ${LR_HEADS:-5e-4}
    profiles:
      - classifier

  # Service untuk signature training
  signature-training:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bpjs-signature-training
    environment:
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-your-bucket-name}
      - S3_ENDPOINT=${S3_ENDPOINT:-your-s3-endpoint}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-your-access-key}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-your-secret-key}
      - S3_SIGNATURE_PREFIX=${S3_SIGNATURE_PREFIX:-dataset/signature/}
      - SIGNATURE_WORKSPACE=${SIGNATURE_WORKSPACE:-signature-detection}
      - SIGNATURE_PROJECT=${SIGNATURE_PROJECT:-signature-detection-hlx8j-mem1d}
      - SIGNATURE_VERSION=${SIGNATURE_VERSION:-3}
      - SIGNATURE_EPOCHS=${SIGNATURE_EPOCHS:-70}
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - ./dataset:/app/dataset
      - ./outputs:/app/outputs
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - antifraud-network
    command: >
      python3 main.py 
      --pipeline signature 
      --signature_epochs ${SIGNATURE_EPOCHS:-70}
    profiles:
      - signature

networks:
  antifraud-network:
    driver: bridge

volumes:
  dataset-data:
  outputs-data:
  config-data:
  logs-data:
